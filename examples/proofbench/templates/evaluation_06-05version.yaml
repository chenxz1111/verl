templates:
  basic:
    name: "Basic Evaluation Template"
    description: "Basic evaluation template with simple instructions"
    template: |
      You are an **expert math proof grader**. You are judging the correctness of an LLM-generated proof for a math problem.

      ### Input

      Your input will consist of:

      * **Problem Statement**: A mathematical problem that the proof is attempting to solve.
      * **Proof Solution**: The proof that you need to evaluate. This proof may contain errors, omissions, or unclear steps. The proof was generated by another language model.

      ### Task

      Analyze the proof carefully.

      * Identify logical errors, incorrect steps, or unclear reasoning.
      * Give an **integer** score between 0 and 7 with a brief overall assessment.

      ### Calibration — What Counts as an Error

      **Anti-handwave rule.** The proof was produced by an LLM that was explicitly instructed NOT to skip steps or label them as trivial. If the proof nevertheless does so, assume the step could not be justified. Specifically, treat each of the following as a real defect rather than a stylistic quirk:
      - Claiming a step is "trivial / obvious / clearly / easy to see / 显然 / 不难看出" when the claim is not in fact immediately obvious.
      - Skipping algebra-heavy or otherwise nontrivial computational steps ("by a standard calculation", "omitted for brevity").
      - Generalizing a pattern from small cases without proving the general property.
      - Citing a non-existent theorem, or invoking a named result whose hypotheses are not verified (anything a trained mathematician could not quickly confirm from a standard reference).

      **Under-justified claims.** Award credit for intermediate claims ONLY when they are adequately justified within the proof text — not merely asserted. If a step is plausible but under-justified, give conservative partial credit and explicitly note what is missing.

      **Frequent technical pitfalls — run through these before finalizing the score.**
      - *Induction missing the inductive step.* A proof that only handles the base case (or hand-waves the step) is not a valid induction.
      - *Injective ⇒ monotone* is false in general; it requires continuity or similar extra structure.
      - *Named lemmas must be proven, not quoted as black boxes*, unless the lemma is textbook-standard (e.g. power of a point, AM-GM). Proven-but-non-standard claims need an inline argument.
      - *Inequality chains — verify arrow directions end-to-end.* A single flipped inequality anywhere invalidates the chain.
      - *Combinatorial bijections must cover every stated case.* Partial bijections do not count as bijections.
      - *Coordinate / analytic-geometry proofs must actually solve for the critical point(s).* Asserting their existence is not enough.
      - *Alternative methods are fine*, but every logical requirement the proof needed to meet must still be met by the alternative route.

      ### Output Format

      Respond with **only** well-formed XML using the structure below. Do not include any extra text or Markdown.

      **Requirements:**
      - `<score>` must be an integer in [0, 7].
      - `<assessment>` must be a **detailed analysis** that explains your reasoning step-by-step and provides a clear **rationale for the score**. Reference specific claims/lines if present.
      - `<errors>` must be a list of specific issues.

      **Strict XML escaping (applies inside every tag body).**
      - Raw `<` and `&` are forbidden inside tag bodies — write `&lt;` and `&amp;` instead.
      - LaTeX backslashes and `|` may appear verbatim; they are not HTML metacharacters.
      - Do NOT wrap the output in Markdown fences, JSON, or any other envelope. No extra prose before `<score>` or after `</errors>`.

      Example output:

      <score>0</score>
      <assessment>The proof shows a good understanding of the main idea, but has some unclear reasoning and minor mistakes...</assessment>
      <errors>
        1. specific error 1,
        2. specific error 2,
        ...
      </errors>

      **Mini-checklist — run silently before emitting.**
      ✓ Exactly three tags, in order: `<score>`, `<assessment>`, `<errors>`.
      ✓ `<score>` is an integer in [0, 7].
      ✓ No raw `<` or `&` anywhere inside tag bodies.
      ✓ No Markdown fences, no extra prose.

      ### Scoring Guidelines (0–7 scale)

      * **0**: Completely incorrect; proof is irrelevant, nonsensical, or shows no understanding.
      * **0**: Very poor; major logical flaws, does not solve the problem, but may contain fragments of relevant reasoning.
      * **1–2**: Partial progress; captures some correct reasoning or key ideas, but has significant logical errors, missing steps, or incomplete arguments that make the proof invalid overall.
      * **6–7**: Largely correct; the proof is overall valid and reaches the correct conclusion. Contains only **minor issues** (e.g., small calculation mistakes, notation slips, or slightly unclear wording) that do not undermine correctness.
      * **7**: Fully correct; the proof is complete, logically sound, and clearly presented with no substantive errors.

      ----------------------------------------------------------
      **Problem Statement**
      {problem}

      **Proof Solution**
      {solution}

    variables:
      - problem
      - solution

  with_solution:
    name: "Reference-Anchored Evaluation"
    description: "Grade a student proof against a ground-truth solution, 0-7 scale. Single LLM call; emits <score>/<assessment>/<errors>."
    template: |
      You are an **expert grader for the International Mathematics Olympiad (IMO)**.
      Your task is to evaluate a proposed solution **strictly and rigorously** against a known correct reference solution. IMO standards are extremely high: only arguments that are logically sound, complete, and precise should be rewarded.

      ### General Scoring Rubric (0-7)

      * **7 (Correct):** Complete, correct, and fully rigorous. If the submission contains incorrect attempts or discarded lines of reasoning but ultimately presents a complete and correct proof, it still receives full marks — the presence of earlier dead ends does not detract from the final correct proof.
      * **6 (Almost Correct):** Sound core argument with only minor calculation errors or small gaps in logic. Missing proofs for major components, unjustified key claims, or sketchy major arguments are **not** eligible for 6 points.
      * **1 (Partial Progress):** Substantial non-trivial progress toward a key step of the reference solution. Initial observations, reformulating the problem without making substantive headway, or proving partial results that do not constitute a key step are **not** eligible.
      * **0 (Incorrect):** Does not make substantial progress toward any key step of the reference solution, or is fundamentally flawed. Partial progress without key results, or progress lacking rigor, also lands here.

      Use the intermediate scores only when the partial progress clearly matches a recognizable milestone in the reference solution (e.g. proving a major lemma that is a stepping stone in the reference).

      ### Input Data and Interpretation

      You are provided with:

      1. **Problem Statement** — the IMO-style problem.
      2. **Ground-Truth Solution** — a reference solution. Assume this is correct. It demonstrates one valid approach, but the student's solution may take a different valid route.
      3. **Proposed Solution** — the student submission you must grade.

      ### Evaluation Process

      Follow this structured process:

      1. **Analyze References:** Read the problem and Ground-Truth Solution carefully. Identify the key logical milestones a complete proof must achieve.
      2. **Step-by-Step Verification:** Verify the logical validity and rigor of every step of the Proposed Solution. Identify all flaws, gaps, unjustified assumptions, and errors. **Be careful with solutions that "pretend" to be correct** — make sure you fully understand the logic behind each step.
      3. **Assess Progress:** Determine the extent of non-trivial progress made toward the key milestones identified in step 1. Alternative valid routes are acceptable as long as they reach the same milestones with full rigor.
      4. **Score Determination:** Map the findings onto the General Scoring Rubric to determine the final integer score in [0, 7].

      ### Calibration — What Counts as an Error

      **Anti-handwave rule.** Treat each of the following as a real defect rather than a stylistic quirk:
      - Claiming a step is "trivial / obvious / clearly / easy to see / 显然 / 不难看出" when the claim is not in fact immediately obvious.
      - Skipping algebra-heavy or otherwise nontrivial computational steps ("by a standard calculation", "omitted for brevity").
      - Generalizing a pattern from small cases without proving the general property.
      - Citing a non-existent theorem, or invoking a named result whose hypotheses are not verified.

      **Under-justified claims.** Award credit for intermediate claims ONLY when they are adequately justified within the proof text — not merely asserted.

      ### Output Format

      Respond with **only** well-formed XML using the structure below. Do not include any extra text or Markdown.

      **Requirements:**
      - `<score>` must be an integer in [0, 7].
      - `<assessment>` must be a **detailed analysis** that explains your reasoning step-by-step and provides a clear **rationale for the score**. Reference specific claims/lines in the Proposed Solution, and explicitly compare against the milestones in the Ground-Truth Solution.
      - `<errors>` must be a list of specific issues found in the Proposed Solution.

      **Strict XML escaping (applies inside every tag body).**
      - Raw `<` and `&` are forbidden inside tag bodies — write `&lt;` and `&amp;` instead.
      - LaTeX backslashes and `|` may appear verbatim; they are not HTML metacharacters.
      - Do NOT wrap the output in Markdown fences, JSON, or any other envelope. No extra prose before `<score>` or after `</errors>`.

      Example output:

      <score>1</score>
      <assessment>The proposed solution correctly identifies the main lemma needed (matching the ground truth's Step 2) and proves it rigorously. However, the final step (combining the lemma with the case n=k+1) is missing entirely, and the substitution in line 14 reverses an inequality without justification. Per the rubric, this counts as substantial partial progress toward a key step but does not constitute an almost-correct proof.</assessment>
      <errors>
        1. Final combination step omitted: the proof never closes the induction.
        2. Line 14: inequality direction is silently flipped during substitution.
        3. The auxiliary claim "f is monotone" is asserted without proof.
      </errors>

      **Mini-checklist — run silently before emitting.**
      ✓ Exactly three tags, in order: `<score>`, `<assessment>`, `<errors>`.
      ✓ `<score>` is an integer in [0, 7].
      ✓ No raw `<` or `&` anywhere inside tag bodies.
      ✓ No Markdown fences, no extra prose.

      ----------------------------------------------------------
      **Problem Statement**
      {problem}

      **Ground-Truth Solution**
      {reference_solution}

      **Proposed Solution**
      {student_answer}

    variables:
      - problem
      - reference_solution
      - student_answer

  break_into_steps:
    name: "Break into Steps"
    description: "Decompose the proof into atomic logical steps as an HTML table (no grading)"
    template: |
      You are an EXPERT MATHEMATICAL-PROOF ANALYST. Your task is to decompose a given proof into its atomic logical steps, formatted as an HTML `<table>`.

      **CORE INSTRUCTION:**

      * **Faithful Decomposition**: Decompose the PROPOSED SOLUTION precisely as it is written.
      * **No Error Correction**: If a step in the proof is invalid or fallacious, record the step as presented in the proof (including its claimed dependencies and likely category). Your role is to map the argument, not to validate or correct it.
      * **No Evaluation**: Do NOT evaluate, score, critique, or comment on whether any step is right or wrong. Do NOT add hints, warnings, or judgement words inside any cell. Your output records what the proof says, not whether it is correct — fault-finding is a downstream stage's job.
      * **First-Person Perspective**: Adopt the perspective of the proof's author. Avoid any third-person commentary or quoting (e.g., do not use phrases like "The proof then states...").
      * **Problem Statement Integration**: Incorporate all relevant information from the PROBLEM STATEMENT as initial steps in your decomposition, typically as Premise or Definition entries.

      ### ATOMIC STEP DEFINITION & CATEGORIES

      An *atomic step* is the smallest possible logical step in the proof. Each step must

      * express a single, coherent mathematical assertion, and
      * have an positive integer as its ID, and
      * be tagged with **one** of these four categories:
        - **Premise**: An initial assertion taken as true. This includes givens from the problem statement, explicit assumptions for case analysis or contradiction (e.g., "Assume $P$..." or "Case 1: $n$ is even"), or globally established assumptions. Verbal cues: "Let...", "Suppose...", "Assume...".
        - **Definition**: Introduction of notation, new objects, or recall of existing definitions. Examples: "Define (S = {{x \in \mathbb{{R}} \mid x > 0}})", "Let $n = 2k$", "Recall that a group is...".
        - **Deduction**: Any step derived from preceding steps or established mathematical knowledge. This includes logical inferences, algebraic manipulations, application of theorems, axiom invocation. Examples: "By Theorem X...", "Therefore, $a < c$", "Thus $n^2$ is even".
        - **Conclusion**: A statement that finalizes a segment of the proof (e.g., completes a lemma, resolves a case, confirms a contradiction) or the entire proof. Verbal cues: "Thus, the statement holds", "This is a contradiction", "Q.E.D.".

      ### MARKER COLUMN (Conditional Use)

      Use *only* when you open or close a temporary assumption or lemma.

      | Marker value    | Meaning |
      |-----------------|---------------|
      | `assume`        | Marks the introduction of a local assumption (e.g., "Assume P" or "Lemma X asserts..." or "Case 1: [condition]").    |
      | `contradiction` | Marks the conclusion of the most recent `assume` scope due to a contradiction. |
      | `lemma-end`     | Marks the conclusion of the most recent `assume` scope upon proving a lemma.      |
      | `case-end`      | Marks the conclusion of a specific case within a case analysis. |

      Leave the **Marker** column blank for all other steps.

      ### DEPENDS_ON COLUMN

      List a comma-separated sequence of IDs corresponding to the immediate prerequisite steps that directly justify the current step, as implied or stated in the proof.
      Leave blank when the parent is obvious or none is needed (Premises, Definitions, routine algebra).
      A step is an immediate prerequisite if the current step cannot be justified without it, and there are no intermediate steps in the proof's logic between the prerequisite and the current step that also convey that same justifying information.

      ### OUTPUT FORMAT

      Produce **nothing** except the `### ATOMIC_STEPS` heading followed by the `<table>` block shown below.

      ### ATOMIC_STEPS
      <table>
        <thead>
          <tr><th>ID</th><th>Assertion</th><th>Category</th><th>Marker</th><th>Depends_On</th></tr>
        </thead>
        <tbody>
          <tr><td>1</td><td>$|x - y| \le |x| + |y|$.</td><td>Premise</td><td></td><td></td></tr>
          <!-- The row above is an illustrative example only. Emit one <tr> per atomic step of the actual proof. -->
        </tbody>
      </table>

      **TABLE COLUMN RULES:**
      - **ID**: Sequential integers `1, 2, 3,...`. Steps must be presented in a valid topological order reflecting the proof's flow.
      - **Assertion**: The precise statement of the step as made in (or implied by) the proof, using LaTeX for math wrapped in dollar signs (e.g., `$|x| \ge 0$`, `$a \mid b$`). Because this is an HTML table, the `|` character may appear freely inside LaTeX — no escaping or substitution required.
      - **Category**: Exactly one of: `Premise`, `Definition`, `Deduction`, `Conclusion`.
      - **Marker**: `assume`, `contradiction`, `lemma-end`, `case-end`, or leave the cell empty.
      - **Depends_On**: A comma-separated list of `ID`s for the *immediate* prerequisite steps that the proof uses (or implies) to justify this step (e.g., `1,3`). Leave the cell empty if the step (e.g., a Premise) depends on no prior steps.

      **HTML RULES:**
      - Every data row must have exactly five `<td>` cells. Use `<td></td>` for any blank field.
      - In non-math cell text, escape `<` as `&lt;`, `>` as `&gt;`, and a standalone `&` as `&amp;`.
      - LaTeX inside `$...$` is NOT HTML — do not escape `\`, `|`, `<`, or `>` inside math spans.
      - Close every `<tr>`, `<td>`, `<th>`, `<thead>`, `<tbody>`, and `<table>` tag.

      After `</table>` **do not** add explanations, analysis, or extra text.

      ================================================================

      **PROBLEM STATEMENT:**
      {problem}

      **PROPOSED SOLUTION:**
      {solution}

    variables:
      - problem
      - solution

  find_potential_errors:
    name: "Critique Steps"
    description: "Scan for POTENTIAL errors only (no truth-judgment). Each row records location, why it looks suspicious, and how to verify. Also emits a per-problem VERIFICATION_SPEC."
    template: |
      You are a HYPER-CRITICAL MATHEMATICIAN scanning a student proof for POTENTIAL errors. Your output is a *suspicion list*, not a judgment list. **You do NOT decide whether any step is actually wrong.** A later reviewer will adjudicate every row you emit.

      You also produce a per-proof **VERIFICATION SPEC** that describes the verification strategy at the *whole-problem* level (which steps need code-checking, which case enumerations are required end-to-end, which textbook references must be looked up, what value tables / symbolic checks would settle large parts of the proof at once). The spec is NOT a restatement of the table — it is the macro plan that the row-level `How_To_Verify` cells fit inside.

      ### CALIBRATION — UNIVERSITY-MATH FLUENCY

      Operate at the fluency of a university-level mathematician. Do NOT raise suspicions about: standard algebraic manipulation, textbook results (analysis, calculus, linear algebra, elementary number theory, combinatorics, basic geometry/group/ring theory), conventional shorthand such as "WLOG", "by symmetry", routine case dismissals, or omitting one-line mechanical verifications. A step does NOT belong on the list merely because a textbook would spell it out more fully. Surface only places where a competent mathematician's antenna would actually twitch — invalid-looking moves, citations whose hypotheses are not obviously met, hidden gaps that plausibly require non-trivial content to fill.

      ### INPUT

      1. PROBLEM STATEMENT — the problem.
      2. PROPOSED SOLUTION — the proof under review. **This is the single source of truth for what the student actually wrote.**
      3. ATOMIC STEPS — an HTML table assigning a numeric ID to each step (columns: ID, Assertion, Category, Marker, Depends_On). This is a navigational aid: use the IDs to reference steps precisely, but treat the Assertion column as a paraphrase — it may compress, omit, or slightly misstate what the original solution says.

      ### TASK

      Read the proof end-to-end. For every place that *could* harbor an error, emit one row. Be aggressive — when a step looks even mildly suspicious to a careful reader, list it. **You are NOT deciding correctness; you are flagging things to be checked.** Do not editorialize about severity, do not skip a row because "it's probably fine", and do not skip a row because "I cannot finish the verification" — flagging the suspicion *and* describing how to verify it is exactly the point.

      **WHAT TO REPORT.** Anything a careful reader would want re-checked. Examples (non-exhaustive):
      - A named theorem invoked without verifying its hypotheses.
      - A computation that visibly skips algebra ("by a standard calculation", "略").
      - An inequality manipulation whose direction is non-obvious.
      - A case analysis that may not exhaust all cases.
      - A "bijection" / "injection" claim whose covering or well-definedness is not argued.
      - A step that depends on an object whose properties were never established.
      - A quantifier-scope issue, a silently swapped definition, an induction with no inductive step, etc.
      - "由对称性 / WLOG / 显然 / 不难看出" used to bury a step that plausibly needs content.

      **NO VERDICT, NO SEVERITY.** Do NOT classify the suspicion as "actually wrong" / "probably fine" / "fatal" / "minor" / any severity / weight / impact label, qualitative or numeric. Do NOT triage. Just record the suspicion and how to verify it.

      **NO HARD ROW LIMIT.** List as many distinct potential errors as you find. There is no upper bound; the downstream reviewer will adjudicate.

      **DO NOT REPEAT THE SAME LOCATION.** Each row should target a *distinct* potential issue. If two suspicions are about the same passage and would be checked the same way, merge them into one row. Re-listing the same place under different framings is forbidden.

      ### HOW TO LOOK FOR SUSPICIONS — CONTEXT CHECK

      **Always ground in the PROPOSED SOLUTION.** The ATOMIC STEPS table is only an index; before logging a suspicion, locate the corresponding passage in the original proof text. If the decomposition and the original disagree, trust the original. Do not flag something that exists only in the paraphrase.

      Before listing any potential issue at step N, sweep the surroundings:

      1. **Follow its `Depends_On` column.** Look up every prerequisite step ID listed there (and transitive prerequisites when relevant). Ask: do those cited prerequisites visibly entail step N's assertion? An empty `Depends_On` that *should* have cited something is itself a suspicion worth recording.

      2. **Place step N inside the surrounding proof.** Re-read the problem hypotheses, the 2–3 steps before/after N, and any in-force `Premise` / `Definition` / `assume`-scope steps. A locally fine assertion can still: contradict an earlier assumption, rely on properties never established, escape the scope of a local assumption, or depend on an unintroduced quantifier.

      3. **Check consistency with the conclusion.** Trace whether step N pushes toward the stated goal, or silently proves something weaker / different.

      ### ROW SCHEMA — THREE COLUMNS

      Each row has exactly three `<td>` cells, in this order:

      1. **Location** — where in the proof the suspicion lives. Use the ATOMIC STEPS IDs in one of these forms:
         - `step-N` (single step, e.g. `step-5`)
         - `step-a..b` (contiguous range, e.g. `step-7..9`)
         - `step-N,step-M,...` (disjoint set, e.g. `step-3,step-11`)
         - `global` (a defect not localizable to specific steps)
         Do NOT cite line numbers, raw quotes, or page references.

      2. **Suspect_Reason** — *why this looks suspicious to a careful reader*. One concise sentence pointing at what triggered your antenna (e.g. "named theorem invoked without verifying its hypotheses; the hypothesis $f$ continuous on $[a,b]$ is not visibly established", "case analysis enumerates 3 cases but the partition seems to allow a 4th", "inequality direction reversed mid-chain"). State the trigger, not a verdict — the goal is to give the reviewer enough hint about the candidate defect that the `How_To_Verify` step is well-aimed.

      3. **How_To_Verify** — *the next concrete check a reviewer should perform to settle whether the suspicion is real*. Hard rules:
         - **Personalized to THIS problem.** Generic advice ("look more carefully", "double-check the algebra", "verify the theorem applies") is FORBIDDEN. The cell must name the specific object / value / case / hypothesis to check.
         - **Executable.** State a concrete operation a reviewer can run, with the inputs and the success criterion. Examples: "verify $f(x)=x^3-3x$ is continuous on $[-2,2]$ before applying IVT (textbook check)", "enumerate $n \bmod 6 \in \{{0,1,2,3,4,5\}}$ and confirm step-7's bound holds in each residue", "evaluate $\sum_{{k=1}}^{{10}} k^3 - (\frac{{10 \cdot 11}}{{2}})^2$ and confirm the result is $0$".
         - **Embed code when appropriate.** If the check is a finite computation, write the code DIRECTLY into the cell. Prefer one-line Python / SymPy that the reviewer can copy-paste, e.g.: `python -c "from sympy import *; x=symbols('x'); print(simplify(integrate(x**2,(x,0,1)) - Rational(1,3)))"` (expected output `0`). Keep code short and self-contained; long scripts belong in the VERIFICATION SPEC section, not in this cell.
         - One concise clause per cell (≤ 100 Chinese characters or a single short code line). One clause / one code snippet only — no multi-line prose, no `<br>`.

      ### CELL FORMAT — STRICT

      For Suspect_Reason / How_To_Verify cells:
      - One concise clause each, ≤ 100 Chinese characters per cell (or one short code line for `How_To_Verify`). Shorter is better.
      - No line breaks, no `<br>`, no numbered lists, no bullet points.
      - No first-person reasoning trace ("Let me check", "Looking again", "As computed above"). State the thing, not your thought process.
      - No embedded multi-line derivations. If a calculation is needed, do it mentally; the cell records the conclusion / next step only.
      - No verdict words like "this is wrong", "this is correct", "definitely", "fatal", or any severity / weight label. The whole point of this stage is to defer the truth-judgment.
      - No hedging tails like "however, if we interpret X differently..." — describe the suspicion crisply or omit the row.

      ### VERIFICATION SPEC — WHOLE-PROOF VERIFICATION PLAN

      After the table, emit one markdown section titled `### VERIFICATION_SPEC`. This is a *problem-level* verification plan — a recipe a reviewer (human or future automated checker) can follow to validate (or break) the proof end-to-end. It complements, not duplicates, the row-level `How_To_Verify` cells.

      What belongs in the SPEC (only what applies to this specific problem):
      - **Code checks.** Concrete code snippets (Python / SymPy / NumPy / SageMath) that automate the verifiable parts: closed-form identity checks, finite case enumerations, numerical bounds, modular checks, polynomial factorings, etc. State each snippet's purpose, the inputs, and the expected output.
      - **Finite enumerations.** When a step depends on a finite case split (residues mod $N$, parities, small integer ranges, all permutations of a small set), spell out the full enumeration the reviewer should run.
      - **Textbook / reference lookups.** Named theorems whose hypotheses must be confirmed against a standard reference; cite the theorem name and the exact hypothesis to verify.
      - **Symbolic checks.** Identities or inequalities that can be settled by `simplify` / `factor` / `Poly` rather than by hand.
      - **Counterexample search budgets.** When a claim is universal over small parameters, define the search space and the criterion ("for all $1 \le n \le 30$, check $\dots$").

      What does NOT belong in the SPEC:
      - Re-listing the table rows.
      - Generic study tips ("read the proof carefully", "review the textbook").
      - Strategic commentary on the proof's correctness — keep judgment out of this stage.

      Format: free-form markdown, but each item should be self-contained and immediately actionable. Use fenced code blocks for code. If no problem-specific spec applies (e.g. a purely conceptual proof with nothing to compute or look up), write a single line: `_No automated verification applies; this proof is fully conceptual._`

      ### OUTPUT

      Emit exactly two sections, in this order, with the exact heading text below. Nothing before the first heading; nothing after the SPEC section.

      ### STEP_CRITIQUES
      <table>
        <thead>
          <tr><th>Location</th><th>Suspect_Reason</th><th>How_To_Verify</th></tr>
        </thead>
        <tbody>
          <tr><td>step-5</td><td>引用 IVT 但 $f$ 在 $[a,b]$ 上的连续性未被显式建立</td><td>`python -c "from sympy import *; x=symbols('x'); print(continuous_domain(x**3-3*x, x, Interval(-2,2)))"` 预期输出 `Interval(-2,2)`</td></tr>
          <!-- The row above is illustrative only. Emit one <tr> per distinct suspicion in the actual proof. -->
        </tbody>
      </table>

      ### VERIFICATION_SPEC

      _Replace this placeholder with the per-problem verification plan as described above. Use markdown; embed code blocks where appropriate._

      ### HTML RULES (for the table only)

      - Every data row has exactly three `<td>` cells, in the order Location / Suspect_Reason / How_To_Verify.
      - Inside any cell, math goes in `$...$`; LaTeX backslashes and `|` are fine inside math (HTML, not Markdown).
      - In non-math cell text, escape `<` as `&lt;`, `>` as `&gt;`, and a standalone `&` as `&amp;`.
      - If no suspicion is worth recording, emit an empty `<tbody></tbody>` but still emit the table shell.

      ================================================================

      **PROBLEM STATEMENT:**
      {problem}

      **PROPOSED SOLUTION:**
      {solution}

      **ATOMIC STEPS:**
      {atomic_steps}

    variables:
      - problem
      - solution
      - atomic_steps

  verify_potential_errors:
    name: "Critique Filter"
    description: "Independently re-verify each potential-error row from Stage 2; keep confirmed-real-errors, drop the rest. Output two columns: Location, Error_Reason."
    template: |
      You are a FAULT-FINDING VERIFIER. Stage 2 produced a list of POTENTIAL errors in a student proof, with each row recording where the suspicion lives, why it looked suspicious, and how to verify it. **Your job is to confirm which suspicions are real failures, not to make excuses for the student.** A later stage (Stage 4) will apply a charitable-reading lens to filter false positives — your role here is the OPPOSITE: actively confirm every concrete failure you can. **Do NOT judge the importance, weight, severity, or impact of any error you confirm — that's Stage 4's job.** Do NOT introduce new suspicions Stage 2 didn't list. Your output is a binary verdict per Stage-2 row plus a clean restatement of the defect you found.

      Your calibration is university-math fluency: a row that merely wants the student to spell out more detail is NOT a real defect — that's stylistic. But if executing the row's `How_To_Verify` produces a concrete failure (a hypothesis is genuinely unmet, a case is genuinely missing, a computation is genuinely wrong), keep the row. **Do not pre-filter on the basis of "the student probably meant something fine" — that's Stage 4's job.**

      ### INPUT

      1. PROBLEM STATEMENT — the problem.
      2. PROPOSED SOLUTION — the proof under review. **This is the single source of truth for what the student actually wrote.**
      3. ATOMIC STEPS — an HTML table assigning a numeric ID to each step (columns: ID, Assertion, Category, Marker, Depends_On). Use the IDs as a navigational index into the proof, but treat the Assertion column as a paraphrase; when the decomposition and the original disagree, trust the original.
      4. POTENTIAL ERRORS — Stage 2's potential-error table. Three columns: `Location`, `Suspect_Reason`, `How_To_Verify`. Each row is a candidate, NOT a confirmed error.
      5. VERIFICATION SPEC — Stage 2's problem-level verification plan (markdown). Use it as background when executing a row's `How_To_Verify`: spec entries may give you a longer code snippet, a finite enumeration recipe, or a textbook reference that the row's one-line cell could not fit. The spec is advisory — never invent new errors from it; only use it to make existing-row checks more concrete.

      ### AUDIT PROCEDURE — APPLIED TO EVERY ROW

      For each row in the POTENTIAL ERRORS:

      1. Locate the passage indicated by `Location` in the PROPOSED SOLUTION and read it verbatim. Do not rely on paraphrases.
      2. Re-read the 2–3 surrounding steps and any in-force `Premise` / `Definition` / `assume`-scope steps to put the flagged step in its real context.
      3. **Execute the `How_To_Verify` step.** Actually carry out the check it prescribes — verify the cited theorem's hypotheses, enumerate the missing cases, redo the disputed calculation, trace the quantifier scope, etc. The whole point of Stage 2 was to set up this concrete check; do it.
      4. Reach a binary verdict:
         - **Real error (keep).** The verification produced a concrete failure you can describe in one sentence — a hypothesis is genuinely unmet, a case is genuinely missing, a computation is genuinely wrong, a definition is genuinely misapplied.
         - **Not confirmed (drop).** The verification step actually ran and produced no failure (e.g. you reproduced the calculation and it was correct; you checked the theorem's hypotheses and they were all met); OR the alleged defect lived only in Stage 2's paraphrase and is absent from the original; OR the complaint reduces to "could be spelled out in more detail" — pure style, not substance.

      **DO NOT judge importance.** Do NOT assign any severity / weight / impact label, qualitative or numeric. Stage 4 will judge importance; your only output is the binary keep/drop decision plus a clean restatement of what the proof actually got wrong.

      **DO NOT pre-filter charitably.** Charitable reading ("the student probably meant ...") is Stage 4's job. Your job is to confirm what the verification step actually showed. If the verification produced a concrete failure, keep the row even when you suspect the student might have meant something defensible.

      ### OUTPUT — TWO COLUMNS

      Emit nothing except the `### STEP_CRITIQUES` heading followed by the HTML table below. **The output schema differs from the input.** Two columns only:

      | Column | Meaning |
      |---|---|
      | **Location** | Where the kept error lives in the proof. Same format as Stage 2: `step-N` / `step-a..b` / `step-N,step-M` / `global`. You may keep Stage 2's `Location` verbatim, or adjust it to a more precise step if the verification revealed the defect actually sits at a neighbouring step. Do NOT use line numbers, raw quotes, or page references. |
      | **Error_Reason** | One concise sentence stating *what the proof actually got wrong*, written AFTER you completed the verification. Phrase it in the present tense as a description of the defect ("the hypothesis $f$ continuous on $[a,b]$ is not established before IVT is applied", "the case $n \equiv 2 \pmod 4$ is not handled"), NOT as a possibility ("might be wrong" / "may not hold" forbidden). ≤ 100 Chinese characters. |

      Stage 2's `Suspect_Reason` / `How_To_Verify` cells are NOT carried over — they served their purpose in setting up the verification, but the saved table replaces them with your post-verification finding.

      ### CELL FORMAT — STRICT

      For the `Error_Reason` cell:
      - One concise clause, ≤ 100 Chinese characters. Shorter is better.
      - No line breaks, no `<br>`, no numbered lists, no bullet points.
      - No first-person reasoning trace ("Let me check", "Looking again", "As computed above").
      - No embedded multi-line derivations. If a calculation was needed to confirm, you did it during the audit; the cell records the conclusion.
      - No hedging tails ("may", "might", "could", "if interpreted differently"). Either you confirmed the error and state it crisply, or you drop the row.
      - No severity / weight / impact words ("fatal", "critical", "completely breaks", "minor", numeric severity, etc.).

      ### STEP_CRITIQUES
      <table>
        <thead>
          <tr><th>Location</th><th>Error_Reason</th></tr>
        </thead>
        <tbody>
          <tr><td>step-5</td><td>使用 IVT 但 $f$ 在 $[a,b]$ 上的连续性从未被建立，定理假设条件不满足</td></tr>
          <!-- Example only. Emit one <tr> per CONFIRMED real error; empty <tbody></tbody> if none survive. -->
        </tbody>
      </table>

      ### HTML RULES

      - Every data row has exactly two `<td>` cells, in the order Location / Error_Reason.
      - Math goes in `$...$`; LaTeX backslashes and `|` are fine inside math (HTML, not Markdown).
      - In non-math cell text, escape `<` as `&lt;`, `>` as `&gt;`, and a standalone `&` as `&amp;`.
      - If no row survives, emit an empty `<tbody></tbody>` but still emit the full table shell.
      - After `</table>` do not add explanations, analysis, or extra text.

      ================================================================

      **PROBLEM STATEMENT:**
      {problem}

      **PROPOSED SOLUTION:**
      {solution}

      **ATOMIC STEPS:**
      {atomic_steps}

      **POTENTIAL ERRORS:**
      {potential_errors}

      **VERIFICATION SPEC:**
      {verification_spec}

    variables:
      - problem
      - solution
      - atomic_steps
      - potential_errors
      - verification_spec

  holistic_grade:
    name: "Dimensional Grading"
    description: "Final holistic grade using the basic rubric. Independently re-checks each candidate-error row from the input verified-errors table, classifies confirmed errors as fundamental or minor, and applies an override rule to the final score."
    template: |
      You are an **expert math proof grader** producing the FINAL holistic score for a proof. Your job has three passes that flow into one judgment:

      1. PASS 1 — Read the proof on your own and form an independent grade using the BASIC RUBRIC.
      2. PASS 2 — Independently re-check each row of the input VERIFIED ERRORS table against the original proof; for each row decide accept/reject; for accepted rows classify severity as `fundamental` or `minor`.
      3. PASS 3 — Combine the two into the final score, applying the OVERRIDE RULE below.

      ### INPUT

      1. **PROBLEM STATEMENT** — the problem.
      2. **PROPOSED SOLUTION** — the proof under review. **Single source of truth.**
      3. **ATOMIC STEPS** — an HTML table decomposing the proof into numbered steps (columns: ID, Assertion, Category, Marker, Depends_On). Paraphrase only; trust the original when they disagree.
      4. **VERIFIED ERRORS** — a table of candidate errors (two columns: `Location`, `Error_Reason`). These are claims someone has flagged about the proof; **whether each row is actually an error is for YOU to re-check from scratch** in PASS 2. Treat the table as a list of suspicions to verify against the original proof, not as ground truth.

      ### PASS 1 — INDEPENDENT HOLISTIC READ (basic-rubric grading)

      Read ONLY the PROBLEM STATEMENT and PROPOSED SOLUTION. Do NOT consult the ATOMIC STEPS table or the VERIFIED ERRORS during this pass. Analyse the proof carefully — identify logical errors, incorrect steps, unclear reasoning, and missing justifications. Apply the **BASIC RUBRIC**, the **CALIBRATION rules**, and the **COMMON TECHNICAL PITFALLS** below as your judgment criteria. Produce, internally:

      - a tentative integer `score`,
      - a prose `assessment` that **references specific claims / steps**, walks through your reasoning step-by-step, and **provides a clear rationale for the score**,
      - an `errors` array of concrete, specific issues you found yourself (each item names what is wrong AND, when relevant, what is missing — per the CALIBRATION rules).

      You will refine these in PASS 3.

      ### BASIC RUBRIC — used by PASS 1 and PASS 3

      - **7** — Fully correct; complete, logically sound, clearly presented; no errors at all.
      - **6** — Largely correct and reaches the right conclusion; only minor issues (calculation slips, notation, wording) that do not undermine correctness.
      - **2** — Partial progress; some correct reasoning or a key idea is present, but a fundamental error makes the overall proof invalid.
      - **1** — Very poor; major fundamental error and almost no usable reasoning, but fragments of relevant content remain.
      - **0** — Completely incorrect; irrelevant, nonsensical, no understanding.

      The rubric uses {{0, 1, 2, 6, 7}}. The values 3, 4, 5 are intentionally unused — do not emit them.

      ### CALIBRATION — WHAT COUNTS AS AN ERROR

      **Anti-handwave rule.** The proof was produced by an LLM that was explicitly instructed NOT to skip steps or label them as trivial. If the proof nevertheless does so, assume the step could not be justified. Specifically, treat each of the following as a real defect rather than a stylistic quirk:
      - Claiming a step is "trivial / obvious / clearly / easy to see / 显然 / 不难看出" when the claim is not in fact immediately obvious.
      - Skipping algebra-heavy or otherwise nontrivial computational steps ("by a standard calculation", "omitted for brevity").
      - Generalizing a pattern from small cases without proving the general property.
      - Citing a non-existent theorem, or invoking a named result whose hypotheses are not verified (anything a trained mathematician could not quickly confirm from a standard reference).

      **Under-justified claims.** Award credit for intermediate claims ONLY when they are adequately justified within the proof text — not merely asserted. If a step is plausible but under-justified, give conservative partial credit and explicitly note what is missing in your `assessment` / `errors`.

      ### COMMON TECHNICAL PITFALLS — consult during PASS 1

      The proof was produced by an LLM that was explicitly told NOT to skip steps or label them as trivial. If it nevertheless does so, treat the omission as the proof being unable to justify the step (NOT as acceptable shorthand). Concretely, watch for:
      - Induction with no inductive step (only the base case, or a hand-wave).
      - "Injective ⇒ monotone" without continuity or comparable extra structure.
      - Named lemmas invoked as black boxes when the lemma is non-textbook — proven-but-non-standard claims need an inline argument.
      - Inequality chains with a flipped arrow somewhere along the way.
      - "Bijections" that fail to cover every stated case (partial pairings dressed up as bijections).
      - Coordinate / analytic-geometry proofs that assert critical-point existence without solving for them.
      - "由对称性" / "WLOG" / "显然 / 不难看出" used to bury a step that actually requires content.

      ### PASS 2 — CHARITABLE AUDIT OF STAGE-3 ERRORS

      Now open the VERIFIED ERRORS table. **Each row is a candidate error you must re-check from the original proof.** Apply a charitable-reading lens: confirm a row only when the original text genuinely contains the alleged defect even under the most charitable interpretation; otherwise drop it.

      For each row:

      1. Locate the passage indicated by `Location` in the PROPOSED SOLUTION and read it verbatim, with surrounding context.
      2. Re-read the 2–3 surrounding steps and any in-force `Premise` / `Definition` / `assume`-scope steps.
      3. Apply the **charitable reading** test:
         - Could a competent mathematician interpret this passage in a way that makes the alleged error disappear? Standard shorthand, conventional implicit hypotheses, "WLOG / by symmetry" used legitimately, omitting one-line mechanical verifications — all of these are charitable.
         - Is the alleged defect actually present in the original text, or did the row misread / over-interpret?
         - When the choice is between "the student made a real mistake" and "I am being uncharitable", lean charitable.

      Then assign a **verdict**:

      - `accept` — Even under the most charitable reading you can construct, the defect described by `Error_Reason` is genuinely present in the original proof. You can point at the failing sentence and state the defect crisply.
      - `reject` — A charitable reading dissolves the alleged defect; OR the defect lives only in the row's paraphrase and not the original; OR you cannot independently confirm it from the original text.

      For every `accept` row, also assign a **severity**:

      - `fundamental` — the error is value-bearing for correctness. Use this when at least one of the following holds:
        * The conclusion is not actually established because of this error — even if other steps are fine, the chain does not close.
        * Repairing the error requires substantive new content (a new lemma, a new case analysis, a different proof path), not a one-or-two-sentence patch.
        * The error propagates: subsequent steps lean on the broken claim.
        * The defect category itself is structural — circular reasoning, misapplied named theorem, missing required hypothesis, missing case in a case split, quantifier-scope error, definition swap, key step asserted without proof.
      - `minor` — the error is local and does not propagate. The student could fix it in 1–2 sentences without changing the main argument, and the proof's core argument and conclusion still stand. Examples: an obvious typo in a subscript, a small arithmetic slip that does not change the relevant bound, inconsistent notation whose meaning is clear from context, omitting a line whose conclusion is genuinely immediate.

      **When in doubt between `fundamental` and `minor`, choose `fundamental`.** The asymmetric loss matters — calling a fundamental error "minor" is much worse than the reverse.

      **The `severity` you assign here directly drives PASS 3's OVERRIDE RULE — it is NOT a decorative tag.** A single accepted `fundamental` row pushes the final score into {{0, 1, 2}}; without any `fundamental`, accepted rows can at most cap the score at 6. Assign `severity` deliberately, not by reflex.

      Set `severity` to `null` for every `reject` row.

      ### PASS 3 — COMBINE INTO THE FINAL SCORE

      Apply the OVERRIDE RULE in this exact order:

      ```
      IF any triage row has verdict == "accept" AND severity == "fundamental":
          final score MUST be in {{0, 1, 2}}
              - 0: Completely incorrect; irrelevant, nonsensical, no understanding
              - 1: Very poor; major fundamental error and almost no usable reasoning,
                   but fragments of relevant content remain
              - 2: Partial progress; some correct reasoning or a key idea is present,
                   but a fundamental error makes the overall proof invalid
          choose 0/1/2 based on PASS 1's prose judgment of how much usable content remains.

      ELIF any triage row has verdict == "accept" AND severity == "minor":
          final score = min(PASS 1 score, 6)
          # Usually 6 — only minor errors confirmed, so the proof is largely correct.
          # If PASS 1 already gave 0/1/2 because of issues PASS 1 found independently
          # (and PASS 2 didn't elevate any of them to fundamental), keep PASS 1's
          # stricter judgment.

      ELSE (every triage row is reject):
          final score = PASS 1 score
          # Trust PASS 1. If PASS 1 found no problems, give 7. If PASS 1 itself spotted
          # something PASS 2 didn't see, PASS 1's judgment stands.
      ```

      Update `assessment` and `errors` so they remain consistent with the final score:
      - Top-level `errors` MUST contain every `accept` row's confirmed defect (use the `Error_Reason` text or a clearer rephrasing) AND any independent issues PASS 1 found.
      - If the OVERRIDE RULE pushed the score into {{0, 1, 2}}, `assessment` MUST explicitly cite which fundamental error(s) triggered it.
      - If you accepted everything PASS 1 found AND PASS 2 reduces no further, you may finalize PASS 1's score as-is.

      ### OUTPUT

      Emit exactly one JSON object, no prose, no markdown fences.

      Schema:

      {{
        "score": <int>,
        "assessment": <string>,
        "errors": [ <string>, ... ],
        "critique_triage": [
          {{
            "location": <string>,
            "error_reason": <string>,
            "verdict": <"accept" | "reject">,
            "severity": <"fundamental" | "minor" | null>,
            "reason": <string>
          }}
        ]
      }}

      Field notes:
      - `score` is the FINAL integer score after applying the OVERRIDE RULE.
      - `assessment` is a basic-style prose analysis (like the `basic` template's `<assessment>`). Reference specific claims/steps. If the OVERRIDE pushed the score down, cite which row(s) triggered it.
      - `errors` is a FLAT array of strings — every confirmed defect, basic-style.
      - `critique_triage` MUST have exactly one entry for every row in the VERIFIED ERRORS table (or `[]` if it has none). Preserve `location` verbatim from VERIFIED ERRORS; copy `error_reason` from VERIFIED ERRORS (verbatim or lightly cleaned up). `severity` is `null` exactly when `verdict` is `"reject"`. `reason` is your one-or-two-sentence audit note explaining the verdict (and severity, when accepted).

      ### STRICT JSON FORMATTING RULES

      Your output will be consumed by a strict JSON parser. Violating any rule below will break downstream processing.

      1. **Escape backslashes inside strings.** Every literal backslash (including inside LaTeX) must be written as `\\`. Example: write `"$a \\le b$"`, not `"$a \le b$"`.
      2. **Escape quotation marks inside strings.** Every literal `"` inside a string value must be written as `\"`.
      3. **No meta-output inside string values.** Do NOT include thinking, deliberations, sketches, or re-derivations inside any `reason` / `assessment` / `errors` string. Those fields are for final, reader-facing prose.
      4. **No code fences, no JSON fragments, no markdown blocks inside string values.**
      5. **No literal control characters inside strings.** If you must wrap, write `\n`.
      6. **No trailing commas, no comments, no fenced output.** The whole response must be one pure JSON object.

      ================================================================

      **PROBLEM STATEMENT:**
      {problem}

      **PROPOSED SOLUTION:**
      {solution}

      **ATOMIC STEPS:**
      {atomic_steps}

      **VERIFIED ERRORS:**
      {verified_errors}

    variables:
      - problem
      - solution
      - atomic_steps
      - verified_errors

settings:
  default_template: "basic"
  max_template_length: 1000000
  required_variables: ["problem", "solution"]
